<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superagente</title>
<meta name="description" content="Interface do Superagente: chat com streaming, workflows, plugins, canais, notas, arquivos, memória, dados e configurações.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2316181c'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css?v=11">
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" aria-label="Navegação do agente">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">S</div>
      <span class="brand-name">Superagente</span>
      <button class="icon-btn" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10L5.6 18.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>

    <div class="switch" role="tablist" aria-label="Contexto">
      <button role="tab" aria-selected="false" data-context="apps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>Apps</span>
      </button>
      <button role="tab" aria-selected="true" data-context="agent" class="on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3m0 12v3M4.2 7.5l2.6 1.5m10.4 6 2.6 1.5M19.8 7.5l-2.6 1.5m-10.4 6-2.6 1.5"/><circle cx="12" cy="12" r="3.4"/></svg>
        <span>Agente</span>
      </button>
    </div>

    <div class="side-scroll">
      <nav class="nav" aria-label="Seções do agente">
        <button class="nav-item" data-view="chat" data-new="1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Nova conversa</span>
        </button>
        <button class="nav-item" data-view="tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          <span>Workflows</span>
          <em class="count" id="countTasks">0</em>
        </button>
        <button class="nav-item" data-view="integrations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5a2 2 0 0 1 4 0V5h2.5A1.5 1.5 0 0 1 18 6.5V9h1.5a2 2 0 0 1 0 4H18v2.5a1.5 1.5 0 0 1-1.5 1.5H14v1.5a2 2 0 0 1-4 0V17H7.5A1.5 1.5 0 0 1 6 15.5V13H4.5a2 2 0 0 1 0-4H6V6.5A1.5 1.5 0 0 1 7.5 5H10z"/></svg>
          <span>Plugins</span>
          <em class="count" id="countPlugins">0</em>
        </button>
        <button class="nav-item" data-view="channels">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.4 10.9 15.6 7.2M8.4 13.1l7.2 3.7"/></svg>
          <span>Canais</span>
        </button>
        <button class="nav-item" data-view="notes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>
          <span>Notas</span>
          <em class="count" id="countNotes">0</em>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg>
          <span>Configurações do agente</span>
        </button>
        <button class="nav-item" id="moreToggle" aria-expanded="false" aria-controls="moreGroup">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          <span>Mais</span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="nav-group" id="moreGroup">
          <button class="nav-item sub" data-view="library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>
            <span>Arquivos</span>
            <em class="count" id="countFiles">0</em>
          </button>
          <button class="nav-item sub" data-view="memory">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a4 4 0 0 0-4 4 4 4 0 0 0 0 8 4 4 0 0 0 8 0 4 4 0 0 0 0-8 4 4 0 0 0-4-4z"/></svg>
            <span>Memória</span>
            <em class="count" id="countMemory">0</em>
          </button>
          <button class="nav-item sub" data-view="data">
            <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>
            <span>Dados</span>
            <em class="count" id="countData">0</em>
          </button>
        </div>
      </nav>

      <p class="nav-label">Conversas <em class="count" id="countConvs">0</em></p>
      <div class="conversations" id="conversations" role="list"></div>
    </div>

    <div class="side-foot">
      <div class="setup-card" id="setupCard">
        <div class="setup-top">
          <div>
            <strong>Configure seu agente</strong>
            <span id="setupProgressText">3 de 5 concluídos</span>
          </div>
          <button class="icon-btn" data-dismiss="setup" aria-label="Dispensar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="bar"><i id="setupBar" style="width:60%"></i></div>
        <button class="btn tiny" data-view="settings">Continuar configuração</button>
      </div>

      <button class="plan-card" data-act="upgrade">
        <span class="crown" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 8l4.5 3L12 5l4.5 6L21 8l-2 11H5z"/></svg>
        </span>
        <span style="text-align:left">
          <strong>Melhore seu plano</strong>
          <span id="planLine">18 de 25 créditos usados</span>
        </span>
      </button>

      <div class="user">
        <div class="avatar" id="userInitials">BG</div>
        <div class="user-meta">
          <span class="ws" id="userWorkspace">Workspace</span>
          <span class="nm" id="userName">Você</span>
        </div>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"/></svg>
        <button class="icon-btn bell" id="bellBtn" aria-label="Notificações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 4 2 5 2 5H4s2-1 2-5"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <em id="bellCount">2</em>
        </button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="agent-mark" aria-hidden="true">S</div>
        <div>
          <h1 id="pageTitle">Superagente</h1>
          <p id="pageSub"></p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="pill" id="creditPill">7 créditos</span>
        <button class="upgrade-link" data-act="upgrade">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 3L12 5l4.5 6L21 8l-2 11H5z"/></svg>
          Upgrade
        </button>
        <button class="icon-btn" id="resetDemo" title="Restaurar demonstração" aria-label="Restaurar demonstração">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>
</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h2 id="modalTitle">Título</h2>
      <button class="icon-btn" data-close="1" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="assets/app.js?v=11"></script>
</body>
</html>
